<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121314;--card:#1d1f21;--tx:#ececea;--mu:#9a9fa5;--ac:#ff8a4c;--ok:#51cf66;--bd:#2c2f33}}
:root[data-theme="dark"]{--bg:#121314;--card:#1d1f21;--tx:#ececea;--mu:#9a9fa5;--ac:#ff8a4c;--ok:#51cf66;--bd:#2c2f33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:19px;text-transform:capitalize;text-align:center}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;cursor:pointer}
.nav{width:44px;height:44px;font-size:20px;padding:0}
.sub{text-align:center;color:var(--mu);font-size:13px;margin:2px 0 10px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}
.strip button{padding:6px 0;font-size:12px;text-align:center;line-height:1.25;border-radius:10px}
.strip b{display:block;font-size:16px}
.strip .sel{background:var(--ac);color:#fff;border-color:var(--ac)}
.strip .rest{opacity:.5}.strip .dn{border-color:var(--ok)}
.strip .tod{outline:2px solid var(--tx);outline-offset:1px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:8px;padding:10px 12px}
.ex.on{border-color:var(--ok)}.ex.on .nm{text-decoration:line-through;color:var(--mu)}
.row{display:flex;gap:10px;align-items:center}
.ck{width:32px;height:32px;border-radius:50%;flex:none;padding:0;font-size:18px;line-height:1}
.on .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.bd{flex:1;min-width:0}.nm{font-weight:600}
.tag{font-size:11px;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
.pr{font-size:14px;color:var(--mu)}
.det{margin-top:8px;font-size:13px;color:var(--mu)}
.det input,.note,textarea{width:100%;font:inherit;font-size:15px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-top:6px}
.box{background:var(--card);border:1px dashed var(--ac);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.rd{text-align:center;color:var(--mu);padding:40px 0}
.foot{margin-top:16px;color:var(--mu);font-size:13px}
details summary{cursor:pointer;margin-top:8px}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.det .sets input{width:62px;margin:0;text-align:center}.sets button{padding:6px 10px}
.pe{min-width:32px;height:32px;padding:0 8px;border-radius:16px;flex:none}.nm input{width:100%;font:inherit;font-weight:600;color:var(--tx);background:var(--bg);border:1px solid var(--ac);border-radius:8px;padding:4px 6px}
.sg{display:grid;grid-template-columns:42px 1fr 64px 64px 44px;gap:6px;align-items:center;margin-top:6px;text-align:center}.sg.hd{font-size:11px;color:var(--mu);margin-top:10px}.sg .n{background:var(--bg);border-radius:8px;padding:8px 0;font-weight:600;color:var(--tx)}.det .sg input{width:100%;margin:0;text-align:center}.sg button{padding:8px 0;width:100%}.sg.ok button,.sg.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}
</style></head><body><main>
<div class="top"><button class="nav" id="pv" aria-label="Día anterior">‹</button><h1 id="ti"></h1><button class="nav" id="nx" aria-label="Día siguiente">›</button></div>
<div class="sub" id="su"></div>
<div class="strip" id="st"></div>

<div id="bd"></div>

<textarea id="bk" rows="4" placeholder="Pega aquí una copia para restaurar"></textarea>
<button id="ex" style="margin:6px 6px 0 0">Generar copia</button><button id="im" style="margin-top:6px">Restaurar</button></details></div>
</main>
